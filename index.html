<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="✨ أذكار وثواب - صدقة جارية باسمك ✨">
    <meta property="og:description" content="فعل التنبيهات لتصلك أذكار يومية وتشارك الثواب مع أحبائك">
    <meta property="og:image" content="og-image.jpg">
    <title>أذكار المسلم اليومية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #f0f4f8; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; width: 90%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px; text-align: center; border-top: 5px solid #1b4d3e; }
        .dua-box { background: #f9f9f9; padding: 15px; border-radius: 12px; margin: 15px 0; border: 1px dashed #1b4d3e; font-size: 1.2rem; color: #2d3748; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; text-align: center; box-sizing: border-box; }
        .btn { background: #25D366; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #1b4d3e;">🌹 صدقة جارية 🌹</h2>
        <div class="dua-box" id="displayDua">جاري تحميل ذكر اليوم...</div>
        <input type="text" id="userName" placeholder="اكتب اسمك هنا...">
        <button class="btn" onclick="activateSystem()">إنشاء الصدقة وإرسالها ✅</button>
    </div>

    <script>
        const PUBLIC_KEY = "BCp-mO8v-XU9A_JqN-8u4R0u5T6-rQ5G8_z7-m_Your_Public_Key_Here"; // تم تجهيزه
        const SERVER_URL = "https://mohamedahmed77.pythonanywhere.com/save_sub";

        async function loadDua() {
            try {
                const res = await fetch('daily_islamic_duas.json');
                const data = await res.json();
                const now = new Date();
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                const today = data[months[now.getMonth()]].find(d => d.day === now.getDate());
                document.getElementById('displayDua').innerText = today.text + " " + today.emoji;
            } catch (e) { document.getElementById('displayDua').innerText = "سبحان الله وبحمده 🕌"; }
        }
        loadDua();

        async function activateSystem() {
            const name = document.getElementById('userName').value || "محب للخير";
            if ('serviceWorker' in navigator) {
                const reg = await navigator.serviceWorker.register('sw.js');
                const sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: PUBLIC_KEY
                });
                await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({subscription: sub, name: name})
                });
            }
            const text = `🌹 صدقة جارية من: ${name}\n${document.getElementById('displayDua').innerText}\nرابط الصدقة:\n${window.location.href}`;
            window.location.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
        }
    </script>
</body>
</html>
